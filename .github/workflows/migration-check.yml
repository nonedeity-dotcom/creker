name: Migration check (emulator)

# The 3 -> 4 migration is the one path with real data at stake that nothing else runs.
# On a device creker is always installed fresh, and the cross-app E2E in the sibling
# repository installs it fresh too, so a migration that quietly destroyed 400 days of
# history would pass every check the project had.
#
# Manual: booting an emulator takes several minutes, which is too slow to put on every
# push. Run it whenever the database schema changes.

on:
  workflow_dispatch: {}

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the migration test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --tests "com.creker.screentime.data.local.Migration3To4Test"
