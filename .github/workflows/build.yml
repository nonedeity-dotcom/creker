name: Build debug APK

on:
  push:
    branches:
      - claude/android-screen-time-tracker-4pmx1k
      - claude/creker-architecture-audit-5ismtl
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Compiles the instrumentation APK without running it. SeedTestDataTest is what
      # verifies the provider contract on a device, and nothing else here builds it --
      # a break in it would otherwise surface only in the cross-app E2E, one repository
      # and several steps away.
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Render screenshots
        run: ./gradlew recordPaparazziDebug

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/**/*.png
          if-no-files-found: error

      # The artifact above sits on Azure Blob Storage, which this project's own
      # egress policy has no way to fetch directly. A dedicated branch, fetched
      # through the GitHub API instead, is reachable the same way any other repo
      # content is.
      - name: Publish screenshots to the ci-screenshots branch
        run: |
          set -e
          rm -rf /tmp/shots-repo
          mkdir -p /tmp/shots-repo
          cp app/src/test/snapshots/images/*.png /tmp/shots-repo/
          cd /tmp/shots-repo
          git init -q
          git config user.name "creker-ci"
          git config user.email "ci@creker.local"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The artifact above is a zip behind a GitHub login, which is awkward to
      # install from a phone. A release carries the .apk itself, so the download
      # is one tap -- same arrangement the sibling app (no-burnout) already uses.
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: creker-build-${{ github.run_number }}
          name: Creker APK build ${{ github.run_number }}
          body: Automated debug APK built from ${{ github.sha }}.
          files: app/build/outputs/apk/debug/app-debug.apk
